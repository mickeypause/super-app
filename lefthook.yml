# https://lefthook.dev/configuration/
pre-commit:
  parallel: false
  commands:
    oxfmt:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: bunx oxlint {staged_files}
